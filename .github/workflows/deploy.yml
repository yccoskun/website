name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Test
        run: go test ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build frontend
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Embed frontend into Go binary
        run: |
          rm -rf internal/static/dist/*
          cp -a web/dist/. internal/static/dist/
          touch internal/static/dist/.gitkeep

      - name: Build static binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/website ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/website
          retention-days: 3

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: [self-hosted, linux, website]
    # Pauses for manual approval when the "production" environment has a
    # required reviewer (Settings -> Environments -> production).
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: /home/github-runner/staging

      - name: Activate release
        run: |
          chmod +x /home/github-runner/staging/website
          sudo /usr/local/bin/deploy-website
